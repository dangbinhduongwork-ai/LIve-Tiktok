<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng nhập quản trị · TikTok Live</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #0b1426; color: #edf4ff; font: 16px/1.5 system-ui, sans-serif; }
    main { width: min(100%, 470px); padding: 36px; border: 1px solid #31435e; border-radius: 24px; background: #15233a; }
    h1 { margin: 0 0 12px; font-size: 28px; } p { color: #b4c7e3; }
    label { display: block; margin: 24px 0 8px; } input, button { width: 100%; font: inherit; padding: 12px 15px; border-radius: 10px; }
    input { border: 1px solid #587090; background: #0d1829; color: white; }
    button { margin-top: 18px; border: 0; background: #64a6ff; color: #071629; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .6; } a { color: #a5ccff; } #message { min-height: 24px; color: #fda4af; }
  </style>
</head>
<body>
  <main>
    <h1>Quản trị phiên live</h1>
    <p>Nhập mã quản trị của máy này để kết nối TikTok và điều khiển trận đấu.</p>
    <form id="loginForm" method="post" action="/auth/login">
      <label for="token">Mã quản trị</label>
      <input id="token" name="token" type="password" required autocomplete="current-password" autofocus>
      <button type="submit">Đăng nhập</button>
      <p id="message" role="status" aria-live="polite"></p>
    </form>
    <a href="/game/">Mở màn hình game</a>
  </main>
  <script src="login.js"></script>
</body>
</html>
